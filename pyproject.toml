[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaguard"
version = "0.1.0"
description = "Local policy-conditioned safety assessment with SafePO"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "transformers>=4.51,<5", "safetensors>=0.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["adaguard*"]

[tool.setuptools.package-data]
adaguard = ["*.jinja"]
