[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaguard"
version = "0.1.0"
description = "Check AI agent behavior against user-defined policies with AdaGuard"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["adaguard", "guard-model", "agent-safety", "user-defined-policies", "safepo"]
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "transformers>=4.51,<5", "safetensors>=0.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Yunhao-Feng/AdaGuard"
Repository = "https://github.com/Yunhao-Feng/AdaGuard"
Paper = "https://arxiv.org/abs/2609.34241"
"Hugging Face Paper" = "https://huggingface.co/papers/2609.34241"
"AdaGuard-0.6B" = "https://huggingface.co/Yunhao-Feng/AdaGuard-0.6B"
"AdaGuard-4B" = "https://huggingface.co/Yunhao-Feng/AdaGuard-4B"
"AdaGuard-8B" = "https://huggingface.co/Yunhao-Feng/AdaGuard-8B"

[tool.setuptools.packages.find]
include = ["adaguard*"]

[tool.setuptools.package-data]
adaguard = ["*.jinja"]
